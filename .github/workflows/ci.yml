name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUSTFLAGS: "-Dwarnings"
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  set-msrv:
    runs-on: ubuntu-latest
    outputs:
      msrv: ${{ steps.msrv.outputs.msrv }}
      pinned: ${{ steps.msrv.outputs.pinned }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: msrv
        run: |
          echo "msrv=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].rust_version')" | tee --append "$GITHUB_OUTPUT"
          echo "pinned=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" | tee --append "$GITHUB_OUTPUT"

  linux:
    needs: set-msrv
    runs-on: ubuntu-latest
    name: Build and test (${{ matrix.toolchain }})
    strategy:
      matrix:
        toolchain:
          - ${{ needs.set-msrv.outputs.msrv }}
          - ${{ needs.set-msrv.outputs.pinned }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - name: Install required packages
        run: sudo apt-get install --no-install-recommends --yes ocl-icd-opencl-dev
      # Checking doesn't link, so CUDA builds need neither the toolkit nor a driver.
      - name: Check all feature combinations
        run: |
          cargo check --all-targets
          cargo check --all-targets --no-default-features --features cuda
          cargo check --all-targets --no-default-features --features opencl
      # GitHub-hosted runners have no GPU or OpenCL platform; device tests run in test_gpu.
      - name: Run OpenCL tests
        run: cargo test --no-default-features --features opencl -- --skip test_device_all

  test_gpu:
    needs: set-msrv
    runs-on: ['self-hosted', 'linux', 'x64', 'xlarge+gpu']
    name: Test on GPU
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # TODO: Move the driver installation to the AMI.
      # https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/install-nvidia-driver.html
      # https://www.nvidia.com/en-us/drivers/
      - name: Install CUDA drivers
        run: |
          curl -L -o nvidia-driver-local-repo-ubuntu2404-570.148.08_1.0-1_amd64.deb https://us.download.nvidia.com/tesla/570.148.08/nvidia-driver-local-repo-ubuntu2404-570.148.08_1.0-1_amd64.deb
          sudo dpkg -i nvidia-driver-local-repo-ubuntu2404-570.148.08_1.0-1_amd64.deb
          sudo cp /var/nvidia-driver-local-repo-ubuntu2404-570.148.08/nvidia-driver-local-*-keyring.gpg /usr/share/keyrings/
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes cuda-drivers
          rm nvidia-driver-local-repo-ubuntu2404-570.148.08_1.0-1_amd64.deb
      - name: Load NVIDIA kernel modules and verify GPU
        run: |
          sudo modprobe nvidia
          sudo modprobe nvidia-uvm
          nvidia-smi
      - name: Install required packages
        run: sudo apt-get install --no-install-recommends --yes nvidia-cuda-toolkit ocl-icd-opencl-dev
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: ${{ needs.set-msrv.outputs.pinned }}
      - name: Run tests
        run: cargo test
      - name: Run `add` example
        run: cargo run --example add

  clippy_check:
    runs-on: ubuntu-latest
    name: Clippy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run cargo clippy with cuda and opencl features
        run: cargo clippy --all-targets -- -D warnings
      - name: Run cargo clippy with cuda feature
        run: cargo clippy --all-targets --no-default-features --features cuda -- -D warnings
      - name: Run cargo clippy with opencl feature
        run: cargo clippy --all-targets --no-default-features --features opencl -- -D warnings

  check_fmt_and_docs:
    runs-on: ubuntu-latest
    name: Checking fmt and docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: fmt
        run: cargo fmt --all -- --check
      - name: Docs
        run: cargo rustdoc --all-features -- -D warnings
